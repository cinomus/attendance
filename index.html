<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Посещаемость</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-title" content="Посещаемость">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1c1c1e;--mut:#6b7280;--ln:#e5e7eb;--ok:#16a34a;--ab:#d97706;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--card:#1c1d20;--tx:#f2f2f3;--mut:#9ca3af;--ln:#2e3035;--ok:#4ade80;--ab:#fbbf24;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#111214;--card:#1c1d20;--tx:#f2f2f3;--mut:#9ca3af;--ln:#2e3035;--ok:#4ade80;--ab:#fbbf24;--ac:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;touch-action:manipulation}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:640px;margin:0 auto}
.bar{display:flex;gap:8px;margin-bottom:10px}
select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px;min-width:0}
select{flex:1}input[type=date]{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;touch-action:manipulation}
button.g{background:var(--card);color:var(--mut);border:1px solid var(--ln)}
.sum{display:flex;gap:14px;font-size:14px;color:var(--mut);margin:4px 2px 10px}
.sum b{color:var(--tx)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th{text-align:left;font-size:13px;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--ln)}
td{padding:0;border-bottom:1px solid var(--ln)}
tr:last-child td{border-bottom:0}
td.n{padding:12px}
td.s{width:108px;padding:8px 0 8px 12px;text-align:right;vertical-align:middle;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
td.s .mk{display:inline-grid;place-items:center;box-sizing:border-box;width:48px;height:36px;padding:0 0 4px;border-radius:9px;border:1px solid var(--ln);font-weight:700;font-size:18px;line-height:1;text-align:center;vertical-align:middle}
td.s.p .mk{color:#fff;background:var(--ok);border-color:transparent;padding:0 0 2px 2px}
td.s.a .mk{color:#fff;background:var(--ab);border-color:transparent}
th.m{width:108px;text-align:right;padding:10px 0 10px 12px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
td.x{width:48px;padding:0;text-align:center;white-space:nowrap;color:var(--mut);cursor:pointer;touch-action:manipulation}td.x.c{width:auto;padding:0 8px;text-align:center;white-space:nowrap;color:#dc2626;font-weight:600;font-size:13px}
.add{display:flex;gap:8px;margin-top:10px}.add input{flex:1}
.hint{font-size:13px;color:var(--mut);margin:12px 2px}
.empty{padding:18px;text-align:center;color:var(--mut)}
details{margin-top:14px;font-size:14px;color:var(--mut)}
details .add{margin-top:8px}
.cr{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-top:8px;border:1px solid var(--ln);border-radius:10px;background:var(--card)}
.cr.on{border-color:var(--ac)}
.cn{flex:1;color:var(--tx);cursor:pointer;font-weight:600}.cn i{font-weight:400;color:var(--mut);font-style:normal;font-size:13px;margin-left:6px}
.cd{padding:6px 10px;font-size:14px}.cd.c{background:#dc2626;color:#fff;border-color:#dc2626}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{min-width:0;flex:1}
.ttl{flex:none;font-weight:700;font-size:18px;margin:2px 0 0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.found{font-size:12px;line-height:1.2;font-weight:500;color:var(--mut);margin:1px 0 0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.side{flex:1;min-width:0;max-width:68%;min-height:44px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-start;text-align:right;margin:0;padding:2px 0 4px;background:transparent;color:inherit;border-radius:0;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.ver{font-size:13px;font-weight:500;color:var(--mut);margin:0}
.ph{font-size:14px;padding:9px 12px;margin-bottom:10px;border-radius:10px;background:color-mix(in srgb,var(--ac) 12%,transparent);cursor:pointer}
.ph[hidden]{display:none}
.ghost{margin:2px 2px 0;min-height:1.4em;font-size:13px;line-height:1.4;color:transparent;user-select:text;-webkit-user-select:text;cursor:default}
.ghost::selection,.ghost::-moz-selection{color:var(--tx);-webkit-text-fill-color:var(--tx);background:#fde68a}
.ghost.on{color:var(--ac);-webkit-text-fill-color:var(--ac);cursor:pointer}
#sum{user-select:none;-webkit-user-select:none;touch-action:manipulation}
#off{max-width:100%;min-height:1.3em;font-size:12px;line-height:1.35;margin:0 0 1px;text-align:right}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45);animation:fi .35s}
.ovc{max-width:420px;background:var(--card);color:var(--tx);padding:22px 16px;border-radius:16px;text-align:center;font-size:17px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.ovc small{display:block;margin-top:8px;font-size:13px;line-height:1.35;font-weight:400;white-space:nowrap}
.ovc small.wrap{white-space:normal}
@keyframes fi{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="top"><div class="brand"><div class="ttl" id="ttl">Посещаемость</div><div class="found" id="found"></div></div><button type="button" class="side"><div id="off"></div><div class="ver">версия 51</div></button></div>
<div class="bar">
  <select id="cls"></select>
  <input type="date" id="date">
</div>
<div class="ph" id="ph" hidden></div>
<div class="sum" id="sum"></div>
<table>
  <thead><tr><th>Ученик</th><th class="m">Отметка</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div class="add"><input id="newst" placeholder="Новый ученик" autocomplete="off"><button id="addst">Добавить</button></div>
<div class="hint">Нажатие ставит +. Ещё раз — н. Нажатие на н убирает отметку. Двойное нажатие сразу ставит н. Выберите дату, чтобы посмотреть отметки за этот день.</div>
<div class="ghost" id="ghost">ты всё-таки заглянула сюда</div>
<details>
  <summary>Классы</summary>
  <div id="clslist"></div>
  <div class="add"><input id="newcls" placeholder="Новый класс, например 5А" autocomplete="off"><button id="addcls">Создать</button></div>
</details>
<details>
  <summary>Резервная копия</summary>
  <div class="add">
    <button class="g" id="bksave" style="flex:1">Сохранить в файл</button>
    <label class="g" style="flex:1;text-align:center;border:1px solid var(--ln);border-radius:10px;padding:10px 14px;background:var(--card);color:var(--mut)">Загрузить из файла<input type="file" id="bkload" hidden></label>
  </div>
  <div id="bkm" style="margin-top:8px"></div>
</details>
<script>
var KEY="attendance_v1",S={classes:{},marks:{}};
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S.classes)S.classes={};if(!S.marks)S.marks={};
var cur=S.last||"";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var $=function(i){return document.getElementById(i)};
$("date").value=today();
function mk(){return cur+"|"+$("date").value}
function drawClasses(){
  var names=Object.keys(S.classes);
  if(!names.length){S.classes["Мой класс"]=[];names=["Мой класс"];save()}
  if(!S.classes[cur])cur=names[0];
  $("cls").innerHTML=names.map(function(n){return '<option>'+esc(n)+'</option>'}).join("");
  $("cls").value=cur;S.last=cur;save();
}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function draw(){
  drawClsList();
  var list=S.classes[cur]||[],m=S.marks[mk()]||{},p=0,a=0;
  if(sortList(list))save();
  $("rows").innerHTML=list.length?list.map(function(n,i){
    var v=m[n];if(v==1)p++;if(v==2)a++;
    return '<tr><td class="n">'+esc(n)+'</td><td class="s '+(v==1?'p':v==2?'a':'')+'" data-i="'+i+'"><span class="mk">'+(v==1?'+':v==2?'н':'')+'</span></td><td class="x'+(pend===String(i)?' c':'')+'" data-d="'+i+'">'+(pend===String(i)?'Удалить?':'✕')+'</td></tr>';
  }).join(""):'<tr><td class="empty" colspan="3">Добавьте учеников ниже</td></tr>';
  $("sum").innerHTML='<span>Приехали: <b>'+p+'</b></span><span>Оповестили: <b>'+a+'</b></span><span>Нет отметки: <b>'+(list.length-p-a)+'</b></span>';
}
function setMark(name,v){
  var k=mk();S.marks[k]=S.marks[k]||{};
  if(v==0)delete S.marks[k][name];else S.marks[k][name]=v;
  save();draw();
}
var timer=null,tapI=null,pend=null;
document.addEventListener("dblclick",function(e){e.preventDefault()});
$("rows").addEventListener("click",function(e){
  var del=e.target.closest("[data-d]");
  if(del){var d=del.getAttribute("data-d");if(pend===d){S.classes[cur].splice(+d,1);pend=null;save();draw()}else{pend=d;draw();setTimeout(function(){if(pend===d){pend=null;draw()}},3000)}return}pend=null;
  var cell=e.target.closest("[data-i]");if(!cell)return;var i=cell.getAttribute("data-i");
  var name=S.classes[cur][+i];
  if(timer&&tapI===i){clearTimeout(timer);timer=null;setMark(name,2);return}
  if(timer){clearTimeout(timer);timer=null}
  tapI=i;
  var m=S.marks[mk()]||{},v=m[name]||0;
  setMark(name,v==1?2:v==2?0:1);
  timer=setTimeout(function(){timer=null},280);
});
$("cls").onchange=function(){cur=this.value;S.last=cur;save();draw()};
$("date").onchange=draw;
function normName(s){return String(s).replace(/\u00A0/g," ").replace(/[\u200B\uFEFF]/g,"").replace(/[.!?…]+$/g,"").trim().toLowerCase()}
function byName(a,b){return String(a).localeCompare(b,"ru",{sensitivity:"base"})}
function sortList(list){
  if(!list||list.length<2)return false;
  var prev=list.slice();
  list.sort(byName);
  for(var i=0;i<list.length;i++)if(list[i]!==prev[i])return true;
  return false;
}
function addSt(){
  var v=$("newst").value.trim();if(!v)return;var cw=null;Object.keys(LOVE.codes).forEach(function(k){if(normName(k)===normName(v))cw=LOVE.codes[k]});if(cw){$("newst").value="";var note=Array.isArray(cw)?cw[1]:null;egg("code",Array.isArray(cw)?cw[0]:cw,true,note,!!note);return}
  var l=S.classes[cur];if(l.indexOf(v)<0)l.push(v);
  $("newst").value="";save();draw();
}
$("addst").onclick=addSt;
$("newst").onkeydown=function(e){if(e.key==="Enter")addSt()};
$("addcls").onclick=function(){
  var v=$("newcls").value.trim();if(!v)return;
  if(!S.classes[v])S.classes[v]=[];
  cur=v;$("newcls").value="";save();drawClasses();draw();
};
var pendC=null;
function drawClsList(){
  $("clslist").innerHTML=Object.keys(S.classes).map(function(n){
    var c=S.classes[n].length,on=n===cur,p=pendC===n;
    return '<div class="cr'+(on?' on':'')+'" data-n="'+esc(n)+'"><span class="cn">'+esc(n)+' <i>'+c+' уч.</i></span><button class="g cd'+(p?' c':'')+'" data-x="1">'+(p?'Удалить «'+esc(n)+'»?':'Удалить')+'</button></div>';
  }).join("");
}
$("clslist").addEventListener("click",function(e){
  var row=e.target.closest(".cr");if(!row)return;
  var n=row.getAttribute("data-n");
  if(e.target.getAttribute("data-x")){
    if(pendC===n){
      delete S.classes[n];
      Object.keys(S.marks).forEach(function(k){if(k.indexOf(n+"|")===0)delete S.marks[k]});
      pendC=null;if(cur===n)cur="";save();drawClasses();draw();
    }else{
      pendC=n;drawClsList();
      setTimeout(function(){if(pendC===n){pendC=null;drawClsList()}},3000);
    }
    return;
  }
  pendC=null;cur=n;drawClasses();draw();
});
function msg(t){$("bkm").textContent=t}
$("bksave").onclick=async function(){
  var name="poseshchaemost-"+today()+".json";
  var text=JSON.stringify({v:1,classes:S.classes,marks:S.marks});
  try{
    var file=new File([text],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});msg("Файл отправлен");return;
    }
  }catch(e){if(e&&e.name==="AbortError"){msg("Отменено");return}}
  try{
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));
    a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
    msg("Файл сохранён (проверьте загрузки)");
  }catch(e){msg("Не удалось сохранить")}
};
$("bkload").onchange=function(){
  var inp=this,f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{var d=JSON.parse(r.result);if(!d.classes||typeof d.classes!=="object")throw 0;
      var added=0;Object.keys(d.classes).forEach(function(c){var l=Array.isArray(d.classes[c])?d.classes[c]:[];if(!S.classes[c]){S.classes[c]=[];added++}l.forEach(function(n){if(S.classes[c].indexOf(n)<0)S.classes[c].push(n)})});var dm=d.marks||{};Object.keys(dm).forEach(function(k){var t=S.marks[k]=S.marks[k]||{};Object.keys(dm[k]).forEach(function(n){if(!(n in t))t[n]=dm[k][n]})});save();drawClasses();draw();msg("Данные добавлены из файла. Новых классов: "+added)}
    catch(e){msg("Файл не подходит")}
    inp.value="";
  };
  r.readAsText(f);
};
/* ===== Тёплые сюрпризы: тексты можно менять здесь ===== */
var LOVE={
  sign:"Сделано с заботой 💛",
  secret:"Ты делаешь очень важное дело, и это не остаётся незамеченным 💛",
  codes:{"секрет":["Ты замечательная 💛","Это был самый сложный секрет. Ты выиграла букет цветов и поход в ресторан 💐"]},
  dates:{},
  fri:["Пятница! Неделя была длинной, а ты её выдержала 🎉","Ещё один тяжёлый день позади. Ты справилась 💪","Пятница. Отдых сегодня точно заслужен ☕️"],
  eve:["Рабочий день закончился. Можно отпустить этот день 🌙","На сегодня достаточно. Ты сделала много 💛","Хорошего вечера. Пусть он будет только твоим ✨"],
  day:["Ты сегодня уже сделала больше, чем замечаешь сама 💛","Столько дел, и ты всё равно замечаешь каждого 🌷","Даже обычный день с тобой становится теплее ☀️","Рядом с тобой сразу спокойнее ☺️","Тобой легко восхищаться, даже после долгого дня ✨","Ты умеешь делать обычное особенным\u00A0✨","Такая работа выматывает. Ты с ней справляешься прекрасно 💪","Можно выдохнуть. Ты и так уже молодец 🌿","От тебя хочется улыбаться. Само как-то получается 😊","О тебе думают с теплом. Прямо сейчас 💛","Иногда секрет прячется среди новых учеников 🤫"],
  nag:["Всё уже готово. Не нажимай ещё раз","Серьёзно: ещё одно нажатие ни к чему","Лучше остановись и больше не нажимай","Последний раз прошу — не нажимай"],
  prize:"Ты выиграла Kinder Bueno 🍫",
  prizeNote:"(к кому обратиться за наградой ты знаешь ☺️)"
};
var EGGS=["ttl","sum","code","off","sel","swl","swp"];
function foundN(){var f=S.found||{};return EGGS.reduce(function(n,k){return n+(k==="off"?(f.off||S.kb?1:0):(f[k]?1:0))},0)}
function drawFound(){var el=$("found");if(el)el.textContent="Секретики: "+foundN()+" из "+EGGS.length}
function markFound(k){S.found=S.found||{};if(S.found[k])return;S.found[k]=1;save();drawFound()}
function seenEgg(k){var f=S.found||{};return k==="off"?(f.off||S.kb):!!f[k]}
function egg(k,t,stay,sub,wrap){if(seenEgg(k))return;overlay(t,stay,sub,wrap);markFound(k)}
function overlay(t,stay,sub,wrap){
  var o=document.createElement("div");o.className="ov";
  o.innerHTML='<div class="ovc">'+esc(t)+(sub?'<small'+(wrap?' class="wrap"':'')+'>'+esc(sub)+'</small>':'')+'</div>';
  o.onclick=function(){o.remove()};
  document.body.appendChild(o);
  if(!stay)setTimeout(function(){o.remove()},9000);
}
var tp=[];
$("sum").addEventListener("click",function(){
  var n=Date.now();tp=tp.filter(function(t){return n-t<2000});tp.push(n);
  if(tp.length>=5){tp=[];egg("sum",LOVE.secret)}
});
var lp=null;
["touchstart","mousedown"].forEach(function(ev){$("ttl").addEventListener(ev,function(){
  clearTimeout(lp);lp=setTimeout(function(){
    var notes=[LOVE.sign].concat(LOVE.day);
    egg("ttl",notes[Math.floor(Math.random()*notes.length)]);
  },700);
})});
["touchend","touchcancel","touchmove","mouseup","mouseleave"].forEach(function(ev){$("ttl").addEventListener(ev,function(){clearTimeout(lp)})});
var tlX=0,tlY=0,tl=0;
$("ttl").addEventListener("touchstart",function(e){
  if(e.touches.length!==1)return;
  tlX=e.touches[0].clientX;tlY=e.touches[0].clientY;tl=1;
},{passive:true});
$("ttl").addEventListener("touchend",function(e){
  if(!tl||!e.changedTouches.length)return;
  var t=e.changedTouches[0],dx=t.clientX-tlX,dy=t.clientY-tlY;tl=0;
  if(dx<-72&&Math.abs(dy)<36)egg("swl","Ой, а что это ты делаешь? Решила все секретики найти? 😏");
},{passive:true});
var swX=0,swY=0,swN=null;
$("rows").addEventListener("touchstart",function(e){
  var n=e.target.closest&&e.target.closest("td.n");
  if(!n||e.touches.length!==1){swN=null;return}
  swX=e.touches[0].clientX;swY=e.touches[0].clientY;swN=n;
},{passive:true});
$("rows").addEventListener("touchend",function(e){
  if(!swN||!e.changedTouches.length)return;
  var t=e.changedTouches[0],dx=t.clientX-swX,dy=t.clientY-swY;swN=null;
  if(dx>72&&Math.abs(dy)<36)egg("swp","Все любят, когда их гладят 🐱");
},{passive:true});
var ghost=$("ghost");
function bindGhost(){
  if(!ghost)return;
  ghost.onclick=function(){
    if(!ghost.classList.contains("on"))return;
    egg("sel","Вот ты и нашла то, чего не было видно 💛");
    dropGhost();
  };
}
function dropGhost(){if(!ghost)return;ghost.remove();ghost=null}
function showGhost(){
  if(ghost)return;
  ghost=document.createElement("div");
  ghost.className="ghost";ghost.id="ghost";
  ghost.textContent="ты всё-таки заглянула сюда";
  document.querySelector(".hint").insertAdjacentElement("afterend",ghost);
  bindGhost();
}
if(S.found&&S.found.sel)dropGhost();else bindGhost();
document.addEventListener("selectionchange",function(){
  if(!ghost||ghost.classList.contains("on"))return;
  var sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.rangeCount)return;
  if(ghost.contains(sel.anchorNode)||ghost.contains(sel.focusNode))ghost.classList.add("on");
});
var rst=null,rstX=0,rstY=0;
function resetEggs(){
  S.found={};S.kb=0;offStep=0;offLock=false;save();drawFound();showGhost();
  if(offBase)offStatus(offBase,offOk);
  overlay("Секретики сброшены");
}
function rstMove(e){if(rst&&(Math.abs(e.clientX-rstX)>28||Math.abs(e.clientY-rstY)>28))stopRst()}
function rstTouch(e){if(!rst||!e.touches.length)return;var t=e.touches[0];if(Math.abs(t.clientX-rstX)>28||Math.abs(t.clientY-rstY)>28)stopRst()}
function clearRst(){
  document.removeEventListener("mousemove",rstMove);
  document.removeEventListener("touchmove",rstTouch);
  document.removeEventListener("mouseup",stopRst);
  document.removeEventListener("touchend",stopRst);
  document.removeEventListener("touchcancel",stopRst);
}
function armRst(x,y){
  stopRst();rstX=x;rstY=y;
  rst=setTimeout(function(){clearRst();rst=null;resetEggs()},10000);
  document.addEventListener("mousemove",rstMove);
  document.addEventListener("touchmove",rstTouch,{passive:true});
  document.addEventListener("mouseup",stopRst);
  document.addEventListener("touchend",stopRst);
  document.addEventListener("touchcancel",stopRst);
}
function stopRst(){clearTimeout(rst);rst=null;clearRst()}
$("found").addEventListener("touchstart",function(e){
  if(e.touches.length!==1)return;
  e.preventDefault();
  armRst(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});
$("found").addEventListener("mousedown",function(e){if(e.button===0)armRst(e.clientX,e.clientY)});
$("found").addEventListener("contextmenu",function(e){e.preventDefault()});
function dailyPhrase(){
  var d=new Date(),k=today();
  if(S.ph===k)return;
  var t=LOVE.dates[k.slice(5)];
  if(!t){
    var pool=LOVE.day.slice();
    if(d.getDay()===5)pool=LOVE.fri.concat(pool);
    else if(d.getHours()>=19)pool=LOVE.eve.concat(pool);
    if(pool.length)t=pool[Math.floor(d.getTime()/864e5)%pool.length];
  }
  if(!t)return;
  var el=$("ph");el.textContent=t;el.hidden=false;
  el.onclick=function(){el.hidden=true;S.ph=k;save()};
}
dailyPhrase();
drawClasses();draw();
var offBase="",offOk=false,offStep=0,offLock=false;
function offStatus(t,ok){
  offBase=t;offOk=!!ok;
  if(offLock)return;
  var o=$("off");
  o.textContent=t;
  o.style.color=ok?"var(--ok)":"var(--mut)";
  document.querySelector(".side").style.cursor=(ok&&!S.kb)?"pointer":"default";
}
document.querySelector(".side").onclick=function(){
  if(S.kb||!offOk)return;
  var o=$("off");
  if(offStep<4){
    offLock=true;
    o.textContent=LOVE.nag[offStep];
    o.style.color="var(--ab)";
    offStep++;
    return;
  }
  egg("off",LOVE.prize,true,LOVE.prizeNote);
  S.kb=1;save();
  offLock=false;offStatus(offBase,offOk);
};
drawFound();
if("serviceWorker"in navigator){
  var had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(had){had=false;location.reload()}});
  navigator.serviceWorker.register("sw.js").then(function(){return navigator.serviceWorker.ready}).then(function(){
    setTimeout(function(){
      caches.match("index.html",{ignoreSearch:true}).then(function(r){
        offStatus(r?"Офлайн-режим: готов ✓":"Офлайн-режим: не готов. Откройте приложение при включённом интернете",!!r);
      });
    },1500);
  }).catch(function(){offStatus("Офлайн-режим недоступен в этом браузере",false)});
}else offStatus("Офлайн-режим недоступен в этом браузере",false);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
